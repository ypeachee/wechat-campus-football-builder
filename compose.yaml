services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: campus_football
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
