name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: campus_football_test
          MYSQL_USER: campus
          MYSQL_PASSWORD: campus
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_URL: "jdbc:mysql://127.0.0.1:3306/campus_football_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      TEST_DB_USERNAME: campus
      TEST_DB_PASSWORD: campus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend verification
        run: |
          chmod +x mvnw
          ./mvnw -q verify
      - name: Runtime container build
        run: |
          cp target/campus-football-api-0.0.1-SNAPSHOT.jar campus-football.jar
          docker build -f Dockerfile.runtime -t campus-football-api:ci .

  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - name: Install mini-program dependencies
        run: npm ci --prefix miniprogram
      - name: Mini-program verification
        run: npm --prefix miniprogram run verify