<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <meta name="description" content="校园足球联赛官方网站：赛程、积分榜、球队球员资料与数据榜单。">
  <title>泥地soccer | Mud Soccer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css?v=20261105-matchroom">
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="泥地soccer首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M24 4 42 14v20L24 44 6 34V14L24 4Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path d="m24 13 9 5.2v10.4L24 34l-9-5.4V18.2L24 13Z" fill="currentColor" opacity=".18"/>
            <path d="m24 18 5 3v6l-5 3-5-3v-6l5-3Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>泥地soccer</strong>
          <small>MUD SOCCER</small>
        </span>
      </a>

      <nav class="primary-nav" id="primary-nav" aria-label="主导航">
        <a href="#/" data-nav="home">首页</a>
        <a href="#/fixtures" data-nav="fixtures">赛程</a>
        <a href="#/standings" data-nav="standings">积分榜</a>
        <a href="#/stats" data-nav="stats">数据榜</a>
        <a href="#/teams" data-nav="teams">球队</a>
        <a href="#/admin" data-nav="admin" id="admin-nav-link" hidden>管理台</a>
        <a href="#/tactics" data-nav="tactics">战术板</a>
      </nav>

      <div class="header-tools">
        <label class="season-select" for="season-select">
          <span>赛季</span>
          <select id="season-select" aria-label="选择赛季">
            <option value="">加载中</option>
          </select>
        </label>
        <a class="button button-small button-ghost auth-entry" id="auth-entry" href="#/login">
          <span class="status-dot"></span>
          <span id="auth-entry-label">管理入口</span>
        </a>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <section class="page-loading" aria-live="polite">
      <div class="loader-mark"></div>
      <p>正在加载赛事数据…</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <strong>泥地soccer</strong>
        <p>让每一场比赛被看见，让每一份热爱有迹可循。</p>
      </div>
      <div class="footer-links">
        <a href="#/fixtures">赛程</a>
        <a href="#/standings">积分榜</a>
        <a href="#/teams">球队</a>
        <a href="#/tactics">战术板</a>
        <a href="#/login">管理入口</a>
      </div>
      <span class="footer-meta">Mud Soccer · Web MVP</span>
    </div>
  </footer>

  <nav class="bottom-nav" aria-label="移动端导航">
    <a href="#/" data-nav="home"><span class="bottom-icon">⌂</span><span>首页</span></a>
    <a href="#/fixtures" data-nav="fixtures"><span class="bottom-icon">◫</span><span>赛程</span></a>
    <a href="#/standings" data-nav="standings"><span class="bottom-icon">≡</span><span>积分</span></a>
    <a href="#/stats" data-nav="stats"><span class="bottom-icon">↗</span><span>数据</span></a>
    <a href="#/teams" data-nav="teams"><span class="bottom-icon">◉</span><span>球队</span></a>
    <a href="#/tactics" data-nav="tactics"><span class="bottom-icon">▦</span><span>战术</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">此网站需要启用 JavaScript 才能浏览赛事数据。</div></noscript>
  <script type="module" src="/assets/app.js?v=20261105-matchroom"></script>
</body>
</html>
