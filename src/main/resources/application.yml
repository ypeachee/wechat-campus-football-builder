spring:
  application:
    name: campus-football-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_football?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:campus}
    password: ${DB_PASSWORD:campus}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:campus-football-local-development-secret-change-me-2026}
    ttl: ${JWT_TTL:PT2H}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  bootstrap:
    admin-openid: ${ADMIN_WECHAT_OPENID:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:8}
    rating-per-minute: ${RATE_LIMIT_RATING_PER_MINUTE:20}
    report-per-ten-minutes: ${RATE_LIMIT_REPORT_PER_TEN_MINUTES:5}
    discipline-per-minute: ${RATE_LIMIT_DISCIPLINE_PER_MINUTE:10}
    match-write-per-minute: ${RATE_LIMIT_MATCH_WRITE_PER_MINUTE:120}
